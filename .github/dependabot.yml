# Dependabot version updates. Security fixes are separate: they come from
# "Dependabot security updates" in Settings → Code security, open as soon as
# an advisory is published, and ignore the cooldown below.
#
# pnpm-workspace.yaml also sets minimumReleaseAge to 14 days. A security PR
# for a release younger than that fails `pnpm install`; add the exact version
# to minimumReleaseAgeExclude in that PR.
version: 2

updates:
  - package-ecosystem: npm # also handles pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait two weeks after a release before proposing it. Malicious or broken
    # releases are usually caught and pulled within days; this keeps them out.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      # One PR for all routine minor/patch bumps instead of one per package
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Hold majors that need a deliberate migration. Remove an entry when
      # you are ready to do that upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"] # tracks the Node 24 runtime in CI
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
