# Secret scanning and static analysis. Runs on pull requests, pushes to main,
# and weekly, so a newly published CodeQL query also gets run against code
# that hasn't changed.
#
# CodeQL runs here because CodeQL "default setup" is off for this repository
# (Settings → Code security). If you switch default setup on, delete the
# codeql job: GitHub rejects a second CodeQL upload from a workflow while it
# is on.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the last commit
          persist-credentials: false

      # The gitleaks CLI, not gitleaks-action. On a pull request the action
      # scans with --no-merges --first-parent, so it skips commits that reach
      # the PR through a merged branch. This scans every commit in history.
      # The download is pinned to a version and its SHA-256 from the
      # release's checksums file, and the job fails if the hash differs.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      # Reads .gitleaksignore for reviewed false positives. By default git log
      # shows no diff for a merge commit, so a secret added only while
      # resolving a merge is never scanned. --diff-merges=first-parent adds
      # each merge's diff against its first parent.
      - name: Scan full history
        run: ./gitleaks git . --redact --no-banner --verbose --log-opts="--all --diff-merges=first-parent"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:javascript-typescript"
